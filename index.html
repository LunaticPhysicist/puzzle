<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Sari</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
  /* Layout: a single quiet reading column, letter-like, signature with a barely visible line beneath it */
  :root{
    --bg:#edf0f2; --ink:#1c232b; --soft:#7b8794; --line:#c9d0d7;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#11151a; --ink:#dde3ea; --soft:#6f7b88; --line:#2a323b; color-scheme:dark}
  }
  :root[data-theme="dark"]{--bg:#11151a; --ink:#dde3ea; --soft:#6f7b88; --line:#2a323b; color-scheme:dark}
  *{box-sizing:border-box} html{background:var(--bg)} body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--serif); font-size:19px; line-height:1.75;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:56px 120px;
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:34em; margin:0 auto; min-width:0}
  h1{font-size:1.6rem; font-weight:400; font-style:italic; margin:0 0 2rem; letter-spacing:.01em; text-wrap:balance}
  p{margin:0 0 1.5em; overflow-wrap:anywhere}
  .sig{margin:2.5rem 0 0; font-style:italic; font-size:1.35rem; text-align:right}
  .line{display:flex; align-items:flex-end; gap:.5rem; width:17rem; max-width:100%; margin:.4rem 0 0 auto}
  .crane{flex:none; font-size:1.25rem; line-height:1; opacity:.75; margin-bottom:.3rem}
  .line input{
    display:block; flex:1; min-width:0; height:2rem; background:transparent; border:0;
    border-bottom:1px solid var(--line); color:var(--soft); text-align:center;
    font:inherit; font-size:1rem; padding:0; outline:none; caret-color:transparent;
    border-radius:0; -webkit-appearance:none; appearance:none;
  }
  .line input:focus{caret-color:var(--soft); border-bottom-color:var(--soft)}
  .line input::placeholder{color:var(--soft); opacity:.55; font-size:.8rem; font-style:italic; letter-spacing:.02em}
  .line input:focus::placeholder{opacity:.35}
  .rev{animation:fade 1.6s ease both}
  @keyframes fade{from{opacity:.15; filter:blur(3px)} to{opacity:1; filter:none}}
  @media (prefers-reduced-motion: reduce){.rev{animation:none}}
  @media (max-width:480px){body{font-size:17.5px; padding-block:40px 96px}}

  /* Pantalla de acceso al primer acertijo */
  body:not(.unlocked){padding:0;min-height:100svh;overflow:hidden}
  body:not(.unlocked) main{display:none}
  .gate{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,#263445 0%,#111923 46%,#0a1018 100%);color:#ecf0f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .gate-card{width:min(100%,440px);text-align:center;padding:45px 28px;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:rgba(255,255,255,.045);box-shadow:0 28px 90px rgba(0,0,0,.23)}
  .gate-icon{font-size:2rem;display:block;margin-bottom:21px}
  .gate-kicker{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:#a8b4c3;margin-bottom:15px}
  .gate h2{font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.2;letter-spacing:-.035em;font-weight:500;margin:0 0 16px}
  .gate-desc{font-size:.93rem;line-height:1.7;color:#aebccc;margin:0 0 28px}
  .gate-input{display:block;width:100%;background:#111a25;color:#fff;border:1px solid #506071;border-radius:12px;padding:16px 17px;font:inherit;font-size:1rem;outline:none}
  .gate-input:focus{border-color:#d9c8a6;box-shadow:0 0 0 3px rgba(217,200,166,.14)}
  .gate-submit{cursor:pointer;margin-top:13px;width:100%;padding:16px;border:0;border-radius:12px;background:#e7dbc3;color:#17202a;font:600 1rem system-ui}
  .gate-submit:hover{background:#fff0d3}
  .gate-feedback{min-height:1.5rem;margin:15px 0 0;color:#ffc1bd;font-size:.87rem}
  body.unlocked .gate{display:none}
  @media (prefers-reduced-motion:no-preference){.gate-card{animation:gate-in .65s ease both}@keyframes gate-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<section class="gate" id="gate" aria-labelledby="gate-title">
  <div class="gate-card">
    <span class="gate-icon" aria-hidden="true">✧</span>
    <div class="gate-kicker">Acertijo · 01</div>
    <h2 id="gate-title">Inserte el mensaje del acertijo 1 primero</h2>
    <p class="gate-desc">La siguiente página permanece oculta hasta que descubras la respuesta.</p>
    <form id="gate-form">
      <input class="gate-input" id="gate-answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Mensaje del acertijo 1" placeholder="Escribe aquí tu respuesta…" required>
      <button class="gate-submit" type="submit">Desbloquear</button>
      <p class="gate-feedback" id="gate-feedback" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
<main>
  <h1>Hola Sari,</h1>
  <div id="t"></div>
  <p class="sig">Joseph</p>
  <label class="line"><span class="crane" aria-hidden="true">🦢</span><input id="k" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" placeholder="aquí no hay nada… ¿o sí? ››" aria-label="firma"></label>
</main>

  var host = document.getElementById('t');
  var box = document.getElementById('k');
  function back(s, n){
    var o = '';
    for (var i = 0; i < s.length; i++){
      var c = s.charCodeAt(i);
      if (c >= 97 && c <= 122) o += String.fromCharCode((c - 97 - n + 26) % 26 + 97);
      else if (c >= 65 && c <= 90) o += String.fromCharCode((c - 65 - n + 26) % 26 + 65);
      else o += s.charAt(i);
    }
    return o;
  }
  function draw(n){
    host.innerHTML = '';
    C.forEach(function(p, i){
      var el = document.createElement('p');
      if (n){ el.className = 'rev'; el.style.animationDelay = (i * 0.45) + 's'; }
      el.textContent = n ? back(p, n) : p;
      host.appendChild(el);
    });

  box.addEventListener('input', function(){

    var ok = (v === '2' || v === 'twostepsahead');

<script>
(function(){
  const form=document.getElementById('gate-form');
  const answer=document.getElementById('gate-answer');
  const feedback=document.getElementById('gate-feedback');
  form.addEventListener('submit',function(event){
    event.preventDefault();
    const value=answer.value.toLowerCase().replace(/\s+/g,'');
    if(value==='twostepsahead'||value==='2'){
      document.body.classList.add('unlocked');
      answer.value='';
      document.getElementById('k').focus();
    }else{
      feedback.textContent='Ese no es el mensaje correcto. Inténtalo otra vez.';
      answer.select();
    }
  });
})();
</script>
